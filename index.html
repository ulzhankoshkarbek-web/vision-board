function pic(f,m,q,cb,t){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(t||"image/jpeg",q))};im.src=r.result};r.readAsDataURL(f)}
function bgApply(){const b=S.set.bg||{k:"0"},s=document.body.style;let v="";if(b.k=="img"&&b.img)v=`url(${b.img}) center/cover`;else if(BG[b.k])v=BG[b.k];s.background=v;s.backgroundAttachment="fixed"}
function secH(b){const ds=S.dreams.filter(d=>d.sec==b.id);return(ds.length?`<i class="cn9">${ds.length}</i>`:"")+ds.slice(0,3).map(d=>`<span class="pl ${d.st==2?"d9":""}">${esc(d.t)}</span>`).join("")+(ds.length>3?`<span class="pl">+${ds.length-3}</span>`:"")}
function sector(i){const b=S.board[i],ds=S.dreams.filter(d=>d.sec==b.id);const o=modal(`<h2>${esc(bt(b.t))}</h2><div style="color:var(--mf);font-size:13px;margin-bottom:10px">${esc(bt(b.d))}</div>${ds.length?ds.map(d=>`<div class="st" data-d="${d.id}" style="cursor:pointer"><div class="th" style="${d.img?`background-image:url(${d.img})`:""}">${d.img?"":"✨"}</div><div style="flex:1;min-width:0"><b style="display:block">${d.st==2?"✓ ":""}${esc(d.t)}</b><div class="pw"><div class="pb"><i style="width:${prog(d)}%"></i></div><span class="pc">${prog(d)}%</span></div></div><span class="bg">${T("s"+d.st)}</span></div>`).join(""):`<div class="emp" style="padding:20px">${T("empS")}</div>`}<div class="acts" style="justify-content:space-between"><button class="btn" id="se">✏️ ${T("ec")}</button><button class="btn p" id="sa2">+ ${T("add")}</button></div>`);
o.querySelectorAll("[data-d]").forEach(e=>e.onclick=()=>{o.remove();edit(e.dataset.d)});o.querySelector("#sa2").onclick=()=>{o.remove();edit(null,b.id)};o.querySelector("#se").onclick=()=>{o.remove();cell(i)}}
function board(){return `<div class="bd9">${S.board.map((b,i)=>`<div class="bc ${i==4?"me":""} ${b.img?"im":lum(b.c)<110?"l":""}" data-i="${i}" style="${b.img?`background-image:linear-gradient(#0003,#0006),url(${b.img})`:`background:${b.c}`}"><b>${esc(bt(b.t))}</b><small>${esc(bt(b.d))}</small>${secH(b)}</div>`).join("")}</div>`}
function cell(i){const b=S.board[i];let im=b.img;const o=modal(`<h2>✏️ ${esc(bt(b.t))}</h2><label>${T("t")}</label><input id="bt1" value="${esc(bt(b.t))}"><label>${T("note")}</label><textarea id="bd1">${esc(bt(b.d))}</textarea><div class="row"><div><label>${T("clr")}</label><input type="color" id="bc1" value="${b.c}" style="height:38px;padding:2px"></div><div><label>${T("img")}</label><input type="file" id="bf2" accept="image/*"></div></div><div class="prev" id="bp" style="${im?`background-image:url(${im})`:"display:none"}"></div><div class="acts"><button class="btn d" id="br">${T("rm")}</button><button class="btn" id="bx">${T("cn")}</button><button class="btn p" id="bv">${T("save")}</button></div>`);
const p=o.querySelector("#bp");o.querySelector("#bf2").onchange=e=>pic(e.target.files[0],720,.7,u=>{im=u;p.style.cssText=`background-image:url(${u})`});
o.querySelector("#br").onclick=()=>{im="";p.style.display="none"};o.querySelector("#bx").onclick=()=>o.remove();
o.querySelector("#bv").onclick=()=>{const t=o.querySelector("#bt1").value.trim(),d=o.querySelector("#bd1").value;if(t&&t!=bt(b.t))b.t=t;if(d!=bt(b.d))b.d=d;b.c=o.querySelector("#bc1").value;b.img=im;save();o.remove();render()}}
function theme(){const r=document.documentElement;S.set.theme=="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",S.set.theme);r.lang=S.set.lang;document.title=T("app");bgApply()}
function remind(){if(!S.set.rem||!window.Notification||Notification.permission!="granted")return;const t=new Date().toDateString();if(S.set.seen==t)return;const u=S.dreams.filter(d=>d.st<2&&days(d)!==null&&days(d)>=0&&days(d)<=3);if(u.length){S.set.seen=t;save();try{new Notification(T("up"),{body:u.map(d=>d.t).join(", ")})}catch(e){}}}
try{const ic="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#18181b"/><text x="256" y="340" font-size="280" text-anchor="middle">✨</text></svg>');
const m={name:"Армандар картасы",short_name:"Армандар",display:"standalone",background_color:"#18181b",theme_color:"#18181b",start_url:".",icons:[{src:ic,sizes:"512x512",type:"image/svg+xml"}]};
const l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));document.head.appendChild(l)}catch(e){}
theme();render();remind();setInterval(remind,36e5);
</script></body></html>
